name: KB Retrieval Eval

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: pip install python-frontmatter pydantic pydantic-settings
      - name: Run retrieval eval (recall@4, gate 90%)
        working-directory: apps/api
        run: python scripts/eval_retrieval.py 4
      - name: Check stale assets
        working-directory: apps/api
        run: python scripts/check_stale.py
